<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .bg-panel { fill: #0D1117; stroke: #30363D; stroke-width: 1; }
      .bg-header-band { fill: #161B22; }
      .accent-stripe { fill: #FF4500; }
      .hairline { stroke: #21262D; stroke-width: 1; }
      .hairline-bright { stroke: #30363D; stroke-width: 1; }
      
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }

      .text-hero { font-size: 32px; font-weight: 800; fill: #F0F6FC; letter-spacing: -0.035em; }
      .text-sub { font-size: 13px; font-weight: 600; fill: #8B949E; letter-spacing: 0.08em; }
      .text-tag { font-size: 11px; font-weight: 700; fill: #FF4500; letter-spacing: 0.12em; }
      .text-meta { font-size: 10px; font-weight: 500; fill: #6E7681; letter-spacing: 0.06em; }
      .text-badge { font-size: 10px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.08em; }

      .corner-screw { fill: none; stroke: #484F58; stroke-width: 1; }

      /* Telemetry Animations */
      @keyframes pulse-signal {
        0%, 100% { opacity: 1; r: 4px; }
        50% { opacity: 0.35; r: 3px; }
      }
      @keyframes scan-radar {
        0% { transform: translateX(0); opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { transform: translateX(260px); opacity: 0.2; }
      }
      @keyframes ticker-glow {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }
      @keyframes wave-motion {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }

      .beacon { animation: pulse-signal 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .scanner-beam { animation: scan-radar 3.2s linear infinite; }
      .ticker-text { animation: ticker-glow 2.4s ease-in-out infinite; }
      .wave-live { stroke-dasharray: 4, 4; animation: wave-motion 4s linear infinite; }
    </style>

    <pattern id="dot-grid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262D" />
    </pattern>

    <linearGradient id="scanner-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF4500" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Main Hardware Chassis -->
  <rect x="0.5" y="0.5" width="879" height="239" rx="6" class="bg-panel" />

  <!-- Dot Grid Pattern Matrix (Right Section) -->
  <rect x="580" y="38" width="290" height="170" fill="url(#dot-grid)" opacity="0.65" />

  <!-- Top Functional Signal Stripe -->
  <path d="M 1 6 Q 1 1 6 1 L 180 1 L 180 5 L 1 5 Z" class="accent-stripe" />
  <rect x="180" y="1" width="694" height="4" fill="#21262D" />

  <!-- Top System Header Bar -->
  <rect x="1" y="5" width="878" height="32" class="bg-header-band" />
  <line x1="1" y1="37" x2="879" y2="37" class="hairline-bright" />

  <!-- System Header Metadata -->
  <text x="24" y="25" class="font-mono text-tag">CATALOG NO: MM-GH-2026</text>
  <text x="220" y="25" class="font-mono text-meta">// SPEC: TEENAGE-RAMS CHASSIS v4.0</text>
  
  <!-- Right Status Indicator in Header -->
  <g transform="translate(680, 16)">
    <rect x="0" y="0" width="176" height="18" rx="2" fill="#1F242C" stroke="#30363D" stroke-width="1" />
    <circle cx="12" cy="9" r="4" fill="#FF4500" class="beacon" />
    <text x="22" y="12.5" class="font-mono text-badge" fill="#E6EDF3">SYS: ONLINE // 100% NOMINAL</text>
  </g>

  <!-- Milled Screw Fasteners on Corners -->
  <g transform="translate(14, 48)">
    <circle cx="0" cy="0" r="3.5" class="corner-screw" />
    <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="#484F58" stroke-width="0.8" />
  </g>
  <g transform="translate(866, 48)">
    <circle cx="0" cy="0" r="3.5" class="corner-screw" />
    <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="#484F58" stroke-width="0.8" />
  </g>

  <!-- Left Content Block -->
  <!-- Brand Badge & Title -->
  <g transform="translate(32, 78)">
    <!-- Orange Detent Tab -->
    <rect x="0" y="-18" width="86" height="20" rx="2" fill="#FF4500" />
    <text x="10" y="-4" class="font-mono text-badge">ARCHIVE 01</text>

    <!-- Main Display Heading -->
    <text x="0" y="32" class="font-sans text-hero">MUMEN OSMAN</text>
    
    <!-- Subtitle / Role -->
    <text x="0" y="60" class="font-mono text-sub">PRODUCT ENGINEER <tspan fill="#484F58">//</tspan> <tspan fill="#F0F6FC">FULL STACK / UX/UI/XR</tspan></text>

    <!-- Bio / Elevator Statement -->
    <text x="0" y="86" class="font-mono text-meta" fill="#8B949E">FROM PIXEL TO PRODUCTION — OPERATING AT THE INTERSECTION OF</text>
    <text x="0" y="102" class="font-mono text-meta" fill="#8B949E">FULL-STACK WEB SYSTEMS, TACTILE INTERFACES &amp; SPATIAL COMPUTING.</text>
  </g>

  <!-- Vertical Divider Hairline -->
  <line x1="560" y1="37" x2="560" y2="208" class="hairline" />

  <!-- Right Telemetry & Oscilloscope Monitor -->
  <g transform="translate(585, 55)">
    <!-- Frame -->
    <rect x="0" y="0" width="265" height="142" rx="4" fill="#12161D" stroke="#262C36" stroke-width="1" />
    
    <!-- Monitor Header -->
    <rect x="0" y="0" width="265" height="22" rx="3" fill="#181D26" />
    <line x1="0" y1="22" x2="265" y2="22" stroke="#262C36" stroke-width="1" />
    <text x="10" y="15" class="font-mono text-meta" fill="#8B949E">TELEMETRY // LIVE RUNTIME</text>
    <circle cx="248" cy="11" r="3" fill="#3FB950" />

    <!-- Waveform Display -->
    <g transform="translate(10, 36)">
      <!-- Grid Lines Inside Monitor -->
      <line x1="0" y1="20" x2="245" y2="20" stroke="#1F2633" stroke-width="1" />
      <line x1="0" y1="45" x2="245" y2="45" stroke="#1F2633" stroke-width="1" />
      <line x1="0" y1="70" x2="245" y2="70" stroke="#1F2633" stroke-width="1" />

      <!-- Sine / Telemetry Path -->
      <path d="M 0 45 Q 30 10 60 45 T 120 45 T 180 45 T 240 45" fill="none" stroke="#FF4500" stroke-width="1.8" class="wave-live" />
      
      <!-- Scanning Radar Line -->
      <line x1="0" y1="0" x2="0" y2="85" stroke="url(#scanner-grad)" stroke-width="16" class="scanner-beam" />
    </g>

    <!-- Monitor Footer Stats -->
    <line x1="0" y1="118" x2="265" y2="118" stroke="#21262D" stroke-width="1" />
    <text x="10" y="132" class="font-mono text-meta" fill="#6E7681">SESS: <tspan fill="#F0F6FC">100K+</tspan></text>
    <text x="95" y="132" class="font-mono text-meta" fill="#6E7681">APPS: <tspan fill="#F0F6FC">10+ PROD</tspan></text>
    <text x="190" y="132" class="font-mono text-meta" fill="#6E7681">UP: <tspan fill="#3FB950">99.9%</tspan></text>
  </g>

  <!-- Bottom Global Chassis Bar -->
  <line x1="1" y1="208" x2="879" y2="208" class="hairline-bright" />
  <rect x="1" y="209" width="878" height="30" fill="#12161D" />

  <!-- Coordinates & Bottom Tags -->
  <text x="24" y="228" class="font-mono text-meta">LOC: GLOBAL / REMOTE</text>
  <text x="220" y="228" class="font-mono text-meta">FOCUS: INDUSTRIAL DESIGN // CREATIVE TECH // ARCHITECTURE</text>
  <text x="730" y="228" class="font-mono text-tag ticker-text">[ DETENT: ENGAGED ]</text>
</svg>
