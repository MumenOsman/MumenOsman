<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

      .bg-panel { fill: #0D1117; stroke: #30363D; stroke-width: 1; }
      .bg-cell { fill: #161B22; stroke: #21262D; stroke-width: 1; }
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }

      .stat-val { font-size: 28px; font-weight: 800; fill: #FF4500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .stat-lbl { font-size: 11px; font-weight: 700; fill: #F0F6FC; letter-spacing: 0.08em; }
      .stat-sub { font-size: 10px; font-weight: 500; fill: #8B949E; letter-spacing: 0.04em; }
      .tag-top { font-size: 10px; font-weight: 700; fill: #6E7681; letter-spacing: 0.1em; }

      @keyframes pulse-bar {
        0%, 100% { transform: scaleX(1); opacity: 0.9; }
        50% { transform: scaleX(0.75); opacity: 0.5; }
      }
      .anim-bar { transform-origin: left; animation: pulse-bar 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="159" rx="6" class="bg-panel" />

  <!-- Top Header Label -->
  <rect x="1" y="1" width="878" height="24" fill="#161B22" />
  <line x1="1" y1="25" x2="879" y2="25" stroke="#30363D" stroke-width="1" />
  <text x="20" y="16" class="font-mono tag-top">AUDITED IMPACT TELEMETRY // PRODUCTION METRICS</text>
  <text x="860" y="16" text-anchor="end" class="font-mono tag-top">SPEC: MM-TRACK-RECORD</text>

  <!-- 4 Stat Metric Cards -->
  <!-- Stat 01 -->
  <g transform="translate(16, 36)">
    <rect x="0" y="0" width="198" height="110" rx="4" class="bg-cell" />
    <rect x="0" y="0" width="198" height="3" fill="#FF4500" />
    <text x="16" y="24" class="font-mono tag-top">METRIC // 01</text>
    <text x="16" y="60" class="font-sans stat-val">100K+</text>
    <text x="16" y="82" class="font-mono stat-lbl">USER SESSIONS</text>
    <text x="16" y="98" class="font-mono stat-sub">Web &amp; Spatial Platforms</text>
  </g>

  <!-- Stat 02 -->
  <g transform="translate(230, 36)">
    <rect x="0" y="0" width="198" height="110" rx="4" class="bg-cell" />
    <rect x="0" y="0" width="198" height="3" fill="#3FB950" />
    <text x="16" y="24" class="font-mono tag-top">METRIC // 02</text>
    <text x="16" y="60" class="font-sans stat-val" fill="#3FB950">10+</text>
    <text x="16" y="82" class="font-mono stat-lbl">LIVE DEPLOYMENTS</text>
    <text x="16" y="98" class="font-mono stat-sub">Production Apps &amp; APIs</text>
  </g>

  <!-- Stat 03 -->
  <g transform="translate(444, 36)">
    <rect x="0" y="0" width="198" height="110" rx="4" class="bg-cell" />
    <rect x="0" y="0" width="198" height="3" fill="#58A6FF" />
    <text x="16" y="24" class="font-mono tag-top">METRIC // 03</text>
    <text x="16" y="60" class="font-sans stat-val" fill="#58A6FF">5K+</text>
    <text x="16" y="82" class="font-mono stat-lbl">COMMUNITY SAVES</text>
    <text x="16" y="98" class="font-mono stat-sub">Stars &amp; Architectural Saves</text>
  </g>

  <!-- Stat 04 -->
  <g transform="translate(658, 36)">
    <rect x="0" y="0" width="206" height="110" rx="4" class="bg-cell" />
    <rect x="0" y="0" width="206" height="3" fill="#D29922" />
    <text x="16" y="24" class="font-mono tag-top">METRIC // 04</text>
    <text x="16" y="60" class="font-sans stat-val" fill="#D29922">99.9%</text>
    <text x="16" y="82" class="font-mono stat-lbl">SYSTEM UPTIME</text>
    <text x="16" y="98" class="font-mono stat-sub">Continuous Availability</text>
  </g>
</svg>
