    </g>
  </g>

  <!-- MODULE 04: CLOUD & INFRASTRUCTURE -->
  <g transform="translate(450, 150)">
    <rect x="0" y="0" width="414" height="100" rx="4" class="bg-module" />
    <rect x="0" y="0" width="414" height="26" rx="3" class="bg-module-head" />
    <line x1="0" y1="26" x2="414" y2="26" stroke="#30363D" stroke-width="1" />
    
    <text x="12" y="17" class="font-mono text-num">04</text>
    <text x="36" y="17" class="font-mono text-title">INFRASTRUCTURE &amp; DEVOPS</text>
    <circle cx="398" cy="13" r="3.5" fill="#D29922" class="led-4" />

    <!-- Pills Grid -->
    <!-- Row 1 -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="60" height="22" rx="2" class="bg-pill" />
      <text x="8" y="15" class="font-mono text-pill">Docker</text>

      <rect x="68" y="0" width="52" height="22" rx="2" class="bg-pill" />
      <text x="76" y="15" class="font-mono text-pill">Linux</text>

      <rect x="128" y="0" width="112" height="22" rx="2" class="bg-pill" />
      <text x="136" y="15" class="font-mono text-pill">GitHub Actions</text>

      <rect x="248" y="0" width="86" height="22" rx="2" class="bg-pill" />
      <text x="256" y="15" class="font-mono text-pill">Cloudflare</text>

      <rect x="342" y="0" width="48" height="22" rx="2" class="bg-pill" />
      <text x="350" y="15" class="font-mono text-pill">GCP</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(12, 66)">
      <rect x="0" y="0" width="98" height="22" rx="2" class="bg-pill" />
      <text x="8" y="15" class="font-mono text-pill">Steamworks</text>

      <rect x="106" y="0" width="88" height="22" rx="2" class="bg-pill" />
      <text x="114" y="15" class="font-mono text-pill">Google Cloud</text>

      <rect x="202" y="0" width="76" height="22" rx="2" class="bg-pill" />
      <text x="210" y="15" class="font-mono text-pill">CI / CD</text>

      <rect x="286" y="0" width="104" height="22" rx="2" class="bg-pill" />
      <text x="294" y="15" class="font-mono text-pill">Cloud Run</text>
    </g>
