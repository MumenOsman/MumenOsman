    <!-- Row 1 -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="62" height="22" rx="2" class="bg-pill" />
      <text x="8" y="15" class="font-mono text-pill">Node.js</text>

      <rect x="70" y="0" width="66" height="22" rx="2" class="bg-pill" />
      <text x="78" y="15" class="font-mono text-pill">Express</text>

      <rect x="144" y="0" width="102" height="22" rx="2" class="bg-pill" />
      <text x="152" y="15" class="font-mono text-pill">Go (Golang)</text>

      <rect x="254" y="0" width="88" height="22" rx="2" class="bg-pill" />
