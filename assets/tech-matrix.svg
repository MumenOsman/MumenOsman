      <rect x="0" y="0" width="76" height="22" rx="2" class="bg-pill" />
      <text x="8" y="15" class="font-mono text-pill">MongoDB</text>

      <rect x="84" y="0" width="40" height="22" rx="2" class="bg-pill" />
      <text x="92" y="15" class="font-mono text-pill">C#</text>

      <rect x="132" y="0" width="32" height="22" rx="2" class="bg-pill" />
      <text x="140" y="15" class="font-mono text-pill">C</text>

      <rect x="172" y="0" width="86" height="22" rx="2" class="bg-pill" />
