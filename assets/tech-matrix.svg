      <rect x="336" y="0" width="54" height="22" rx="2" class="bg-pill" />
      <text x="344" y="15" class="font-mono text-pill">Unity</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(12, 66)">
      <rect x="0" y="0" width="56" height="22" rx="2" class="bg-pill" />
