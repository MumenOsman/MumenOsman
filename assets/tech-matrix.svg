<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .bg-panel { fill: #0D1117; stroke: #30363D; stroke-width: 1; }
      .bg-module { fill: #161B22; stroke: #30363D; stroke-width: 1; }
      .bg-module-head { fill: #1F242C; }
      .bg-pill { fill: #0D1117; stroke: #30363D; stroke-width: 1; }
      
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }

      .text-title { font-size: 13px; font-weight: 700; fill: #F0F6FC; letter-spacing: 0.08em; }
      .text-tag { font-size: 10px; font-weight: 700; fill: #FF4500; letter-spacing: 0.1em; }
      .text-num { font-size: 11px; font-weight: 700; fill: #FF4500; letter-spacing: 0.05em; }
      .text-pill { font-size: 11px; font-weight: 500; fill: #C9D1D9; }
      .text-meta { font-size: 10px; font-weight: 500; fill: #6E7681; letter-spacing: 0.06em; }

      @keyframes led-blink-01 { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes led-blink-02 { 0%, 100% { opacity: 0.4; } 40% { opacity: 1; } }
      @keyframes led-blink-03 { 0%, 100% { opacity: 0.9; } 70% { opacity: 0.2; } }
      @keyframes led-blink-04 { 0%, 100% { opacity: 0.3; } 60% { opacity: 1; } }

      .led-1 { animation: led-blink-01 2.1s infinite ease-in-out; }
      .led-2 { animation: led-blink-02 2.8s infinite ease-in-out; }
      .led-3 { animation: led-blink-03 1.9s infinite ease-in-out; }
      .led-4 { animation: led-blink-04 2.5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Base Rack Frame -->
  <rect x="0.5" y="0.5" width="879" height="269" rx="6" class="bg-panel" />

  <!-- Top Bar of Rack -->
  <rect x="1" y="1" width="878" height="28" fill="#161B22" />
  <line x1="1" y1="29" x2="879" y2="29" stroke="#30363D" stroke-width="1" />
  <text x="20" y="19" class="font-mono text-tag">ENGINEERING DOMAIN MATRIX // CAPABILITIES SPEC</text>
  <text x="680" y="19" class="font-mono text-meta">CHANNELS: 04 // ACTIVE DETENTS</text>

  <!-- 4 Module Blocks (2x2 Grid) -->

  <!-- MODULE 01: FRONTEND -->
  <g transform="translate(16, 40)">
    <rect x="0" y="0" width="414" height="100" rx="4" class="bg-module" />
    <rect x="0" y="0" width="414" height="26" rx="3" class="bg-module-head" />
    <line x1="0" y1="26" x2="414" y2="26" stroke="#30363D" stroke-width="1" />
    
    <text x="12" y="17" class="font-mono text-num">01</text>
    <text x="36" y="17" class="font-mono text-title">FRONTEND ARCHITECTURE</text>
    <circle cx="398" cy="13" r="3.5" fill="#FF4500" class="led-1" />

    <!-- Pills Grid -->
    <!-- Row 1 -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="68" height="22" rx="2" class="bg-pill" />
      <text x="8" y="15" class="font-mono text-pill">React 19</text>

      <rect x="76" y="0" width="84" height="22" rx="2" class="bg-pill" />
      <text x="84" y="15" class="font-mono text-pill">TypeScript</text>

      <rect x="168" y="0" width="86" height="22" rx="2" class="bg-pill" />
      <text x="176" y="15" class="font-mono text-pill">JavaScript</text>

      <rect x="262" y="0" width="66" height="22" rx="2" class="bg-pill" />
      <text x="270" y="15" class="font-mono text-pill">HTML5</text>

      <rect x="336" y="0" width="54" height="22" rx="2" class="bg-pill" />
      <text x="344" y="15" class="font-mono text-pill">CSS3</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(12, 66)">
